<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Vascak-like</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="simulator-container">
        <div id="controls">
            <div>
                <label for="powerSwitch">Encender / Apagar:</label>
                <input type="checkbox" id="powerSwitch">
            </div>
            <div>
                <label for="groundSwitch">Poner a tierra la esfera principal:</label>
                <input type="checkbox" id="groundSwitch">
            </div>
            <div id="sphere-controls">
                <p>Control Esfera de Descarga:</p>
                <button id="moveSphereCloser">Acercar Esfera</button>
                <button id="moveSphereFurther">Alejar Esfera</button>
            </div>
        </div>

        <svg id="simulationCanvas" width="600" height="400">
            <defs>
                <radialGradient id="metallicGradient" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
                    <stop offset="0%" style="stop-color:#e0e0e0; stop-opacity:1" />
                    <stop offset="30%" style="stop-color:#d0d0d0; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#a0a0a0; stop-opacity:1" />
                </radialGradient>
                <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="1" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.3" />
                </filter>
            </defs>
            <rect width="100%" height="100%" fill="#f0f0f0" />

            <!-- Electrometer -->
            <g id="electrometer">
                <rect id="electrometerCase" x="10" y="10" width="60" height="80" fill="#ccc" />
                <line id="electrometerNeedle" x1="40" y1="70" x2="40" y2="30" stroke="black" stroke-width="2" />
            </g>

            <!-- Van de Graaff Generator -->
            <g id="vanDeGraaffGenerator" transform="translate(200, 250)">
                <rect id="generatorBase" x="-30" y="50" width="60" height="30" fill="#aaa" />
                <rect id="generatorColumn" x="-10" y="-50" width="20" height="100" fill="#bbb" />
                <circle id="mainDome" cx="0" cy="-75" r="50" fill="#ddd" />
                <g id="mainDomeCharges"></g> <!-- Container for '+' charges -->
            </g>

            <!-- Discharge Sphere Assembly -->
            <g id="dischargeSphereAssembly" transform="translate(400, 175)"> <!-- Adjusted Y to align with main dome cy-75 from generator y 250 = 175 -->
                <rect id="dischargeSphereBase" x="-20" y="50" width="40" height="20" fill="#aaa" /> <!-- Relative to its own group's (0,0) -->
                <rect id="dischargeSphereArm" x="-5" y="-40" width="10" height="90" fill="#bbb" />
                <circle id="dischargeSphere" cx="0" cy="-65" r="25" fill="#ddd" />
                <g id="dischargeSphereCharges"></g> <!-- Container for induced charges -->
            </g>

            <!-- Sparks Container -->
            <g id="sparksContainer">
                <!-- Sparks will be added here by JavaScript -->
            </g>
        </svg>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
