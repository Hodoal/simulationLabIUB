<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vascak-style Van de Graaff Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="simulatorContainer" style="text-align: center;">
        <div id="controlsArea" style="margin-bottom: 10px;">
            <label>Power: <input type="checkbox" id="powerSwitch"></label>
            <label>Ground: <input type="checkbox" id="groundSwitch"></label>
        </div>

        <svg id="simulationCanvas" width="400" height="300" style="border: 1px solid #ccc; background-color: #f0f8ff;">

            <!-- Electrometer Group -->
            <g id="electrometer" transform="translate(30, 150)">
                <rect id="electrometerCase" x="0" y="-30" width="40" height="60" fill="#f0f0f0" stroke="#888" stroke-width="1"/>
                <circle id="electrometerPivot" cx="20" cy="20" r="2" fill="#333"/>
                <line id="electrometerNeedle" x1="20" y1="20" x2="20" y2="-20" stroke="red" stroke-width="2" transform="rotate(0 20 20)"/>
                <text x="5" y="25" font-size="10px" fill="#333">0</text>
                <text x="30" y="-25" font-size="10px" fill="#333" text-anchor="end">Max</text>
            </g>

            <!-- Van de Graaff Generator Group -->
            <g id="vdgGenerator" transform="translate(200, 200)">
                <rect id="vdgStandBase" x="-40" y="0" width="80" height="20" fill="#d3d3d3" stroke="#aaa"/>
                <rect id="vdgColumn" x="-10" y="-80" width="20" height="80" fill="#d3d3d3" stroke="#aaa"/>
                <circle id="mainDome" cx="0" cy="-110" r="40" fill="#silver" stroke="#777"/>
                <g id="domeCharges"></g> <!-- Charges Container -->
            </g>

            <!-- Discharge Sphere Apparatus -->
            <g id="dischargeSphereApparatus" transform="translate(300, 90)" style="cursor: grab;">
                <rect id="dischargeHandle" x="-5" y="0" width="10" height="70" fill="#8B4513" rx="3" ry="3"/>
                <circle id="dischargeSphere" cx="0" cy="-15" r="15" fill="#C0C0C0" stroke="#555" stroke-width="1"/>
                <g id="dischargeSphereCharges"></g>
            </g>

            <!-- Two Movable Bunches of Papers Apparatus -->
            <g id="twoBunchesApparatus" transform="translate(300, 200)" style="visibility: hidden;">
                <!-- Bunch A (Left) -->
                <g id="bunchA_assembly" transform="translate(0,0)" style="cursor: grab;">
                    <circle id="bunchA_holder" cx="0" cy="0" r="8" fill="#d0d0d0" stroke="#777" stroke-width="1"/>
                    <g id="bunchA_strips_container">
                        <path id="bunchA_strip1" d="M 0 8 L 0 28 Z" stroke="#444" stroke-width="1.5" fill="none"/>
                        <path id="bunchA_strip2" d="M -3 8 L -3 28 Z" stroke="#444" stroke-width="1.5" fill="none" style="transform-origin: -3px 8px;"/>
                        <path id="bunchA_strip3" d="M 3 8 L 3 28 Z" stroke="#444" stroke-width="1.5" fill="none" style="transform-origin: 3px 8px;"/>
                    </g>
                    <g id="bunchA_charges"></g>
                </g>
                <!-- Bunch B (Right) -->
                <g id="bunchB_assembly" transform="translate(60,0)" style="cursor: grab;">
                    <circle id="bunchB_holder" cx="0" cy="0" r="8" fill="#d0d0d0" stroke="#777" stroke-width="1"/>
                     <g id="bunchB_strips_container">
                        <path id="bunchB_strip1" d="M 0 8 L 0 28 Z" stroke="#444" stroke-width="1.5" fill="none"/>
                        <path id="bunchB_strip2" d="M -3 8 L -3 28 Z" stroke="#444" stroke-width="1.5" fill="none" style="transform-origin: -3px 8px;"/>
                        <path id="bunchB_strip3" d="M 3 8 L 3 28 Z" stroke="#444" stroke-width="1.5" fill="none" style="transform-origin: 3px 8px;"/>
                    </g>
                    <g id="bunchB_charges"></g>
                </g>
                <!-- Visual Connection Wires (placeholders, d attributes to be set by JS) -->
                <path id="connectionToBunchA" d="M0 0" stroke="#aaa" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
                <path id="connectionToBunchB" d="M0 0" stroke="#aaa" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
                <text x="30" y="50" font-size="10px" text-anchor="middle">Bunches</text>
            </g>
        </svg>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
